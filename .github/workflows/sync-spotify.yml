name: Sync music from Spotify

# Refreshes lib/music-catalogue.json from the Holytones artist on Spotify every Monday, and commits
# it to main when something changed. Cloudflare then deploys the update to holytones.no.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch the catalogue from Spotify
        run: node scripts/sync-spotify.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

      - name: Commit changes
        run: |
          if git diff --quiet lib/music-catalogue.json; then
            echo "No new music."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add lib/music-catalogue.json
          git commit -m "Update music from Spotify"
          git push
